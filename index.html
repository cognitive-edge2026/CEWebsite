    <!-- 360 Virtual Tour CSS Optimizations: Prevent accidental gesture refreshing on iOS & macOS Safari -->
    <style>
      #tour-viewer-container,
      #viewer-frame,
      .virtual-tour-iframe,

    <!-- Global Early WebSocket & Error Shielding -->
    <script>
      (function () {
        if (typeof window === "undefined") return;

        // 1. Intercept Vite dev HMR WebSocket attempts to completely prevent "WebSocket closed without opened."
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          var PatchedWebSocket = function (url, protocols) {
            var isViteHmr = false;
            try {
              var urlStr = String(url || "");
              if (
                protocols === "vite-hmr" ||
                (Array.isArray(protocols) && protocols.indexOf("vite-hmr") !== -1) ||
                urlStr.indexOf("token=") !== -1 ||
                urlStr.indexOf("vite") !== -1
              ) {
                isViteHmr = true;
              }
            } catch (_) {}

            if (isViteHmr) {
              var target = new EventTarget();
              var mockSocket = {
                url: String(url || ""),
                readyState: 1, // OPEN
                protocol: "vite-hmr",
                extensions: "",
                bufferedAmount: 0,
                binaryType: "blob",
                send: function () {},
                close: function () {
                  mockSocket.readyState = 3;
                },
                addEventListener: function (type, listener, options) {
                  target.addEventListener(type, listener, options);
                  if (type === "open") {
                    setTimeout(function () {
                      try {
                        var openEvt = new Event("open");
                        target.dispatchEvent(openEvt);
                        if (typeof mockSocket.onopen === "function") {
                          mockSocket.onopen(openEvt);
                        }
                      } catch (_) {}
                    }, 0);
                  }
                },
                removeEventListener: function (type, listener, options) {
                  target.removeEventListener(type, listener, options);
                },
                dispatchEvent: function (evt) {
                  return target.dispatchEvent(evt);
                },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              return mockSocket;
            }

            return new NativeWebSocket(url, protocols);
          };

          PatchedWebSocket.CONNECTING = 0;
          PatchedWebSocket.OPEN = 1;
          PatchedWebSocket.CLOSING = 2;
          PatchedWebSocket.CLOSED = 3;
          PatchedWebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket = PatchedWebSocket;
        }

        // 2. Comprehensive console filtering for any residual WebSocket logs
        var origConsoleError = console.error;
        var origConsoleWarn = console.warn;

        function isWsNoise(val) {
          if (!val) return false;
          var str = "";
          try {
            if (typeof val === "string") {
              str = val;
            } else if (val instanceof Error || typeof val === "object") {
              str = (val.message || "") + " " + (val.stack || "") + " " + String(val);
            } else {
              str = String(val);
            }
          } catch (_) {
            return false;
          }
          str = str.toLowerCase();
          return (
            str.indexOf("websocket closed without opened") !== -1 ||
            str.indexOf("[vite] failed to connect to websocket") !== -1 ||
            str.indexOf("failed to connect to websocket") !== -1
          );
        }

        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            if (isWsNoise(arguments[i])) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };

        console.warn = function () {
          for (var i = 0; i < arguments.length; i++) {
            if (isWsNoise(arguments[i])) {
              return;
            }
          }
          origConsoleWarn.apply(console, arguments);
        };

        // 3. Catch uncaught promise rejections and error events
        window.addEventListener(
          "unhandledrejection",
          function (event) {
            if (!event) return;
            if (isWsNoise(event.reason)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          "error",
          function (event) {
            if (!event) return;
            if (isWsNoise(event.error) || isWsNoise(event.message)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>

    <!-- iOS Safari Motion & DeviceOrientation Permission Handler -->
    <script>
      (function () {
        var motionPermissionGranted = false;

        function requestIOSMotionPermissions() {
          if (motionPermissionGranted) return;

          try {
            // iOS 13+ DeviceOrientationEvent permission request
            if (
              typeof window !== "undefined" &&
              typeof window.DeviceOrientationEvent !== "undefined" &&
              typeof window.DeviceOrientationEvent.requestPermission === "function"
            ) {
              window.DeviceOrientationEvent.requestPermission()
                .then(function (permissionState) {
                  if (permissionState === "granted") {
                    motionPermissionGranted = true;
                  }
                })
                .catch(function () {});
            }

            // iOS 13+ DeviceMotionEvent permission request
            if (
              typeof window !== "undefined" &&
              typeof window.DeviceMotionEvent !== "undefined" &&
              typeof window.DeviceMotionEvent.requestPermission === "function"
            ) {
              window.DeviceMotionEvent.requestPermission()
                .then(function (motionState) {
                  if (motionState === "granted") {
                    motionPermissionGranted = true;
                  }
                })
                .catch(function () {});
            }
          } catch (_) {}
        }

        // Attach touch and click listeners upon user interaction before or when interacting with the tour
        var events = ["click", "touchstart", "touchend", "pointerdown"];
        events.forEach(function (eventType) {
          document.addEventListener(
            eventType,
            function (event) {
              var target = event.target;
              if (!target) return;
              if (
                (target.closest &&
                  (target.closest("#virtual-tour") ||
                    target.closest("#tour-viewer-container") ||
                    target.closest(".virtual-tour-iframe") ||
                    target.closest("iframe") ||
                    target.closest("[id*='tour']"))) ||
                (target.id && target.id.indexOf("tour") !== -1)
              ) {
                requestIOSMotionPermissions();
              }
            },
            { passive: true, capture: true }
          );
        });

        // Expose globally so React components and external triggers can call directly
        window.requestTourMotionPermissions = requestIOSMotionPermissions;
      })();
    </script>
