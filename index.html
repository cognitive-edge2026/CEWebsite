  <body>
    <script>
      // Defensive error shielding for iOS Safari, WebGL contexts, and third-party iframe messengers
      window.addEventListener("error", function (event) {
        if (!event) return;
        var msg = (event.message || "").toLowerCase();
        if (
          msg.includes("websocket") ||
          msg.includes("script error") ||
          msg.includes("webgl") ||
          msg.includes("resizeobserver")
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener("unhandledrejection", function (event) {
        if (!event) return;
        var reason = "" + (event.reason || "");
        if (
          reason.toLowerCase().includes("websocket") ||
          reason.toLowerCase().includes("webgl") ||
          reason.toLowerCase().includes("fullscreen")
        ) {
          event.preventDefault();
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
